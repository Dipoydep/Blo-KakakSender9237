name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: echo "android.useAndroidX=true" > gradle.properties
      # TAMBAHAN: kalau ada res-icons.zip di root repo, otomatis extract
      # isinya (icon app) ke folder res sebelum build, jadi tidak perlu
      # upload file gambar satu-satu secara manual.
      - name: Extract icon jika ada
        run: |
          if [ -f res-icons.zip ]; then
            echo "res-icons.zip ditemukan, mengekstrak ke app/src/main/res..."
            unzip -o res-icons.zip -d app/src/main/res
          else
            echo "res-icons.zip tidak ada, lanjut pakai icon yang sudah ada."
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Sosxa-APK
          path: app/build/outputs/apk/debug/Sosxa.apk
